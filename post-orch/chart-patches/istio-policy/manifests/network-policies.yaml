  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
---
# orch-iam: allow from gateway, platform, self, istio-system, kube-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-orch-namespaces
  namespace: orch-iam
spec:
  podSelector: {}
  policyTypes:
