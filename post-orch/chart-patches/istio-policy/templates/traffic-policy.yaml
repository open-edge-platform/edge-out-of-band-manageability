{{- if (index .Values.authorizationPolicy "orch-infra").enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-orch-infra
  namespace: orch-infra
spec:
  action: ALLOW
  rules:
  # Allow traffic from orch-gateway (ingress)
  - from:
    - source:
        namespaces: ["orch-gateway"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow traffic from orch-platform (keycloak, vault interactions)
  - from:
    - source:
        namespaces: ["orch-platform"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow intra-namespace communication
  - from:
    - source:
        namespaces: ["orch-infra"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow database access from orch-database
  - from:
    - source:
        namespaces: ["orch-database"]
    to:
    - operation:
        hosts:
        - "*"
  # Raw TCP ports (observability, gossip, CIRA) - allow from any meshed source
  - to:
    - operation:
        ports:
        - "7946"  # Loki member list, gossip-ring (Raw TCP)
        - "6831"  # observability-opentelemetry-collector jaeger-compact (Raw UDP)
        - "14268" # edgenode-observability-opentelemetry-collector jaeger-thrift (Raw TCP)
        - "8888"  # edgenode-observability-opentelemetry-collector metrics (Raw TCP)
        - "9411"  # edgenode-observability-opentelemetry-collector zipkin (Raw TCP)
        - "3100"  # edgenode-observability-loki (TCP)
        - "9095"  # edgenode-observability-loki (TCP)
        - "9094"  # edgenode-alerting-alertmanager (TCP)
        - "4433"  # AMT CIRA
{{- end }}
{{- if (index .Values.authorizationPolicy "orch-platform").enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-orch-platform
  namespace: orch-platform
spec:
  action: ALLOW
  rules:
  # Allow traffic from orch-gateway (ingress to keycloak, vault)
  - from:
    - source:
        namespaces: ["orch-gateway"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow traffic from orch-infra (services needing keycloak/vault)
  - from:
    - source:
        namespaces: ["orch-infra"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow intra-namespace communication
  - from:
    - source:
        namespaces: ["orch-platform"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow from orch-ui (UI needs keycloak)
  - from:
    - source:
        namespaces: ["orch-ui"]
    to:
    - operation:
        hosts:
        - "*"
  # Raw TCP ports (observability, vault raft, rs-proxy)
  - to:
    - operation:
        ports:
        - "7946"  # Loki member list, gossip-ring (Raw TCP)
        - "6831"  # observability-opentelemetry-collector jaeger-compact (Raw UDP)
        - "14268" # edgenode-observability-opentelemetry-collector jaeger-thrift (Raw TCP)
        - "8888"  # edgenode-observability-opentelemetry-collector metrics (Raw TCP)
        - "9411"  # edgenode-observability-opentelemetry-collector zipkin (Raw TCP)
        - "8200"  # Vault standby to active
        - "8201"  # Vault standby to active
        - "3100"  # orchestrator-observability-loki (TCP)
        - "9095"  # orchestrator-observability-loki (TCP)
        - "8443"  # rs-proxy
{{- end }}
{{- if (index .Values.authorizationPolicy "orch-gateway").enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-orch-gateway
  namespace: orch-gateway
spec:
  action: ALLOW
  rules:
  # Allow intra-namespace (traefik to certificate-file-server)
  - from:
    - source:
        namespaces: ["orch-gateway"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow external traffic to traefik (ingress controller)
  # Traefik receives traffic from outside the mesh
  - from:
    - source:
        namespaces: ["istio-system"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow passthrough from any source since this is the ingress point
  - to:
    - operation:
        ports:
        - "443"
        - "4433"
        - "9100"  # traefik metrics
{{- end }}
{{- if (index .Values.authorizationPolicy "orch-ui").enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-orch-ui
  namespace: orch-ui
spec:
  action: ALLOW
  rules:
  # Allow traffic from orch-gateway only (UI served via ingress)
  - from:
    - source:
        namespaces: ["orch-gateway"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow intra-namespace
  - from:
    - source:
        namespaces: ["orch-ui"]
    to:
    - operation:
        hosts:
        - "*"
{{- end }}
{{- if (index .Values.authorizationPolicy "orch-database").enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-orch-database
  namespace: orch-database
spec:
  action: ALLOW
  rules:
  # Allow from orch-infra (services accessing postgres)
  - from:
    - source:
        namespaces: ["orch-infra"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow from orch-platform (keycloak accessing postgres)
  - from:
    - source:
        namespaces: ["orch-platform"]
    to:
    - operation:
        hosts:
        - "*"
  # Allow intra-namespace (replication)
  - from:
    - source:
        namespaces: ["orch-database"]
    to:
    - operation:
        hosts:
        - "*"
  # Raw TCP for postgresql
  - to:
    - operation:
        ports:
        - "5432"  # Postgresql
{{- end }}
{{- if (index .Values.authorizationPolicy "orch-app").enabled }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-orch-app
  namespace: orch-app
spec:
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["orch-gateway"]
    to:
    - operation:
        hosts:
        - "*"
  - from:
    - source:
        namespaces: ["orch-app"]
    to:
    - operation:
        hosts:
        - "*"
  - to:
    - operation:
        ports:
        - "5432"  # Postgresql
        - "11211" # memcache
        - "9443"  # adm webhook service
        - "3310"  # malware scanner
{{- end }}
