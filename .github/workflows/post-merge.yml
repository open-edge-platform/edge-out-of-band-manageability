---

name: Post-Merge CI Pipeline

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-merge:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: open-edge-platform/orch-ci/.github/workflows/post-merge.yml@cfb192dcc6a08f6da56ed0f3af272d4f52d84d3e  # 2026.1.3
    with:
      run_build: false
      run_version_check: false
      run_dep_version_check: false
      run_lint: true
      run_test: false
      run_version_tag: false
    secrets:
      SYS_EMF_GH_TOKEN: ${{ secrets.SYS_EMF_GH_TOKEN }}
      NO_AUTH_ECR_PUSH_USERNAME: ${{ secrets.NO_AUTH_ECR_PUSH_USERNAME }}
      NO_AUTH_ECR_PUSH_PASSWD: ${{ secrets.NO_AUTH_ECR_PUSH_PASSWD }}
      MSTEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
