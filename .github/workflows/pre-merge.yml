name: Pre-Merge-EMF-Helmdeploy CI Pipeline
on:
  # Trigger workflow on PRs to all branches
  pull_request:
    branches:
      - "*"
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pre-checks:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: "Verify Branch Name"
        uses: open-edge-platform/orch-ci/verify-branch-name@b5e696bde16e21bb1aaf331efb2222deb826f733  # v2026.1.3
  pre-merge-pipeline:
    needs: pre-checks
    uses: open-edge-platform/orch-ci/.github/workflows/pre-merge.yml@b5e696bde16e21bb1aaf331efb2222deb826f733  # v2026.1.3
    with:
      run_build: false
      run_lint: true
      run_security_scans: true
      run_version_check: false
      run_test: false
      trivy_config_path: trivy.yaml
  final-check:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [pre-merge-pipeline]
    env:
      RESULT: ${{ needs.pre-merge-pipeline.result }}
    steps:
      - name: Final Status Check
        run: |
          pre_merge_pipeline_result="${RESULT}"
          echo "Pre-merge pipeline result: $pre_merge_pipeline_result"
          if [ "$pre_merge_pipeline_result" == "success" ] || [ "$pre_merge_pipeline_result" == "skipped" ]; then
            echo "Pre-merge check passed successfully."
          else
            echo "Pre-merge checks failed. PR can't get merged"
            exit 1
          fi
